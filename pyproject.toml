[build-system]
# `license = "MIT"` (abaixo) e sintaxe PEP 639, suportada a partir do
# setuptools 77 - com uma versao mais antiga instalada (ex.: em CI com cache
# frio), o build falha com "project.license must be valid exactly by one
# definition" em vez de aceitar a string simples.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-to-md"
version = "2.1.0"
description = "Conversor de PDF para Markdown (Docling ou pypdfium2)."
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
# pypdfium2 e o motor minimo obrigatorio: sem ele, a aplicacao (CLI ou web) nao
# tem NENHUM motor disponivel se o extra `docling` nao for instalado, e falha
# no startup (selecionar_motor levanta ErroConversao). !=4.30.1 replica a
# exclusao que o proprio docling-slim faz nessa versao especifica.
dependencies = ["pypdfium2>=4.30.0,!=4.30.1,<6"]

[project.optional-dependencies]
# Motor leve: so extrai a camada de texto nativa do PDF (sem OCR/tabelas).
simples = ["pypdfium2>=4,<6"]
# Motor de alta fidelidade: layout + TableFormer + OCR.
# Faixa de versao testada nesta maquina; docling evolui rapido, por isso um
# teto de major version em vez de fixar um unico patch.
docling = ["docling[rapidocr]>=2.100,<3"]
# Dependencias so para rodar a suite de testes (gera PDFs sinteticos).
dev = ["fpdf2>=2.7,<3"]
# Aplicacao web (v3.0): API FastAPI por cima do pdf_to_md.py existente.
# `pdf-to-md[simples]` garante que a aplicacao tenha ao menos um motor
# funcional mesmo sem o extra `docling` (pesado, opt-in).
# Este extra so traz as DEPENDENCIAS - o wheel nao empacota backend/ nem
# frontend/ (py-modules = ["pdf_to_md"] abaixo cobre so a CLI). Rodar
# `uvicorn backend.src.app:app` exige CWD dentro do repositorio clonado;
# ver dependencies.md#entry-point para o raciocinio completo.
web = [
    "pdf-to-md[simples]",
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30,<1",
    "python-multipart>=0.0.9,<1",
]

[project.scripts]
pdf-to-md = "pdf_to_md:main"

[tool.setuptools]
py-modules = ["pdf_to_md"]
